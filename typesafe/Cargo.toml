[package]
name = "typesafe-rust-sdk"
description = "Rust SDK for the TypeSafe AI API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["typesafe", "ai", "sdk", "api", "classification"]
categories = ["api-bindings", "web-programming::http-client"]
# The crates.io name is undecided; `typesafe-rust-sdk` is taken by an unofficial crate.
publish = false

[lib]
name = "typesafe"

[features]
default = ["derive"]
## `#[derive(QuestionSet)]` and `#[derive(Choices)]` for typed questions and answers.
derive = ["dep:typesafe-macros"]
## Emit request logs and spans through `tracing`.
tracing = ["dep:tracing"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["time"] }
tracing = { version = "0.1.44", optional = true }
typesafe-macros = { path = "../typesafe-macros", version = "0.1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
trybuild = "1.0.122"
wiremock = "0.6.5"

[[example]]
name = "demo"
required-features = ["derive"]

[lints]
workspace = true
