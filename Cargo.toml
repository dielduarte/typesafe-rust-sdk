[workspace]
resolver = "3"
members = ["typesafe", "typesafe-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dielduarte/typesafe-rust-sdk"
homepage = "https://docs.typesafe.ai"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
